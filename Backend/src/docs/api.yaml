openapi: 3.0.0
info:
  title: Quiz Platform API
  version: 1.0.0
  description: >
    REST API for a quiz platform with three roles:
    - **Member**: regular user (can view quizzes and update profile)
    - **Creator**: can create and manage quizzes
    - **Admin**: full access to manage users and content

servers:
  - url: http://localhost:4008


tags:
  - name: Auth
    description: Authentication and account management
  - name: Member
    description: User profile and account settings. Can also take quizzes and participate in tests.
  - name: Creator
    description: Quiz creation and management

paths:
# Auth
  /signup:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a new account with username, and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, repassword]
              properties:
                username:
                  type: string
                password:
                  type: string
                repassword:
                  type: string
      responses:
        "201":
          description: Registration has been successfully completed.
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                missingFields:
                  summary: Missing required fields
                  value: { status: "error", message: "All fields are required." }
                usernameIsBusy:
                  summary: Username is busy
                  value: {status: "error", message: "Username is busy"}
                passwordMismatch:
                  summary: Passwords do not match
                  value: { status: "error", message: "Passwords do not match." }
                weakPassword:
                  summary: Weak password
                  value: { status: "error", message: "Password does not meet the requirements." }

  /login:
    post:
      tags: [Auth]
      summary: Login user
      description: Authenticates a user and returns a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password ,remember]
              properties:
                username:
                  type: string
                password:
                  type: string
                remember:
                  type: boolean
      responses:
        "200":
          description: `{ status: string, message?: string, token: string }`
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                missingFields:
                  summary: Missing required fields
                  value: { status: "error", message: "All fields are required." }
                usernameOrPassword:
                  summary: Incorrect username or password.
                  value: { status: "error", message: "Incorrect username or password." }

  /profile:
    get:
      tags: [Auth]
      summary: Get user profile information
      description: Returns the authenticated user's profile data.
      security:
        - bearerAuth: []   # JWT auth (Authorization header)
      responses:
        "200":
          description: Successfully retrieved user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                    example: 671b5b8dcf9a2d0012f4fbc9
                  username:
                    type: string
                    example: johndoe
                  email:
                    type: string
                    example: johndoe@example.com
                  name:
                    type: string
                    example: John
                  surname:
                    type: string
                    example: Doe
                  phone:
                    type: string
                    example: "+37495306596"
                  avatar:
                    type: string
                    example: "https://example.com/uploads/avatar.jpg"
                  isVerified:
                    type: boolean
                    example: true
                  role:
                    type: string
                    example: member
        "401":
          description: Unauthorized – Missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Unauthorized – invalid or expired token

  /profile/verify:
    post:
      summary: Send account verification email
      description: Sends a verification link to the user's email address.
      tags: [Auth]
      security:
        - bearerAuth: []   # եթե պահանջում է մուտք գործած user-ի token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: johndoe@example.com
              required:
                - email
      responses:
        "200":
          description: Verification email successfully sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Verification email has been sent to your inbox.
        "400":
          description: Invalid or missing email address
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Please provide a valid email address.
        "409":
          description: User already verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: This account has already been verified.
        "500":
          description: Server error – email could not be sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Failed to send verification email. Please try again later.

  /profile/update:
    put:
      summary: Update user profile information
      description: Allows an authenticated user to update their personal information (name, surname, and phone number).
      tags: [Auth]
      security:
        - bearerAuth: []   # JWT auth required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - surname
                - phone
              properties:
                name:
                  type: string
                  example: John
                surname:
                  type: string
                  example: Doe
                phone:
                  type: string
                  description: Must be a valid phone number
                  example: "+37495306596"
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Profile updated successfully.
                  payload:
                    type: string
                    example: User information updated in the database.
        "400":
          description: Invalid input data
          content:
            application/json:
              examples:
                missingFields:
                  summary: Missing required fields
                  value:
                    status: error
                    message: Fields are required.
                invalidPhone:
                  summary: Invalid phone number
                  value:
                    status: error
                    message: Phone number is not valid.
                noChanges:
                  summary: No changes made
                  value:
                    status: error
                    message: No changes were made.
        "401":
          description: Unauthorized – User is not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Unauthorized – invalid or expired token
        "500":
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Internal server error. Please try again later.

  /profile/avatar:
    post:
      summary: Upload or update profile avatar
      description: >
        Uploads a new avatar image for the authenticated user.
        The file should be sent as `multipart/form-data` with the key `picture`.
      tags: [Auth]
      security:
        - bearerAuth: []   # JWT token required
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                picture:
                  type: File
                  description: Image file to upload as avatar
      responses:
        "200":
          description: Avatar uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Avatar path saved in user profile
                  payload:
                    type: string
                    example: /public/uploads/avatar123.png
        "400":
          description: Invalid file or missing picture field
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: File upload failed or picture not provided
        "401":
          description: Unauthorized – User not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Unauthorized – invalid or expired token
        "500":
          description: Server error – failed to save avatar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Failed to upload or save avatar. Please try again later.

# Member 

  /pass:
    get:
      summary: Get all attempts for the authenticated user
      description: Returns all quiz attempts created by the currently authenticated user.
      tags: [Member]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All attempts retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: All attempts retrieved successfully.
                  Attempts:               # ← մեծատառով, ինչպես քո response-ում է
                    type: array
                    items:
                      $ref: '#/components/schemas/Attempt'
              example:
                message: "All attempts retrieved successfully."
                Attempts:
                  - _id: "691efa2e136548557de0728c"
                    userId: "68f9db1073d0652790fac52d"
                    quizId: "6903206815f4c2514d33d5eb"
                    selectedAnswers:
                      - questionId: "6919b254c0a054a55f4c9f27"
                        answerIds: ["691ef86a136548557de0722e"]
                      - questionId: "6919b23dc0a054a55f4c9f11"
                        answerIds: ["691cd65a519586e964447c52"]
                      - questionId: "6919b1d2c0a054a55f4c9e6c"
                        answerIds: ["691ef7ac136548557de07216"]
                      - questionId: "6919b261c0a054a55f4c9f32"
                        answerIds: ["691ef881136548557de0723c"]
                    correctAnswers:
                      - questionId: "691ef9b0136548557de07243"
                        answerIds:
                          - "691ef9f3136548557de0725a"
                          - "691ef9f6136548557de07261"
                          - "691ef9fa136548557de0726a"
                      - questionId: "6919b254c0a054a55f4c9f27"
                        answerIds: ["691ef860136548557de07227"]
                      - questionId: "6919b23dc0a054a55f4c9f11"
                        answerIds: ["691cd65a519586e964447c52"]
                      - questionId: "6919b1d2c0a054a55f4c9e6c"
                        answerIds: ["691ef7ac136548557de07216"]
                      - questionId: "6919b261c0a054a55f4c9f32"
                        answerIds: ["691ef881136548557de0723c"]
                    score: 52
                    isFinished: true
                    isPassed: false
                    startedAt: "2025-11-20T11:23:26.546Z"
                    createdAt: "2025-11-20T11:23:26.547Z"
                    updatedAt: "2025-11-23T08:14:34.890Z"
                    __v: 0

        '404':
          description: No attempts found for this user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: No attempts found for this user.

        '500':
          description: Server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error.


  /pass/quiz/{id}/quotes:
    get:
      summary: Retrieve available question count options for a quiz
      description: Returns the `questionCounts` array for a specific quiz.  
        This indicates how many questions can be selected when taking the quiz.
      tags: [Member]
      security:
        - bearerAuth: []   # JWT authentication required
      parameters:
        - name: id
          in: path
          required: true
          description: Quiz ID
          schema:
            type: string
            example: "67373f9d21f91e23b2a5f1ad"
      responses:
        "200":
          description: Quiz question count retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Quiz question count retrieved successfully.
                  questionCounts:
                    type: object
                    description: Quiz object containing available question count options
                    properties:
                      _id:
                        type: string
                        example: "67373f9d21f91e23b2a5f1ad"
                      questionCounts:
                        type: array
                        items:
                          type: integer
                        example: [5, 10, 15]
        "404":
          description: Quiz not found or access denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Quiz not found or access denied.
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error. Please try again later.

  /pass/quiz/{id}:
    get:
      summary: Start a quiz attempt
      description: >
        Loads a quiz with a random selection of questions based on the
        requested question count. Initializes a new quiz attempt and returns
        the quiz data without correct answer flags.
      tags: [Member]
      security:
        - bearerAuth: []    # JWT authentication required
      parameters:
        - in: path
          name: id
          required: true
          description: Quiz ID
          schema:
            type: string
            example: "67373f9d21f91e23b2a5f1ad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quotes
              properties:
                quotes:
                  type: integer
                  description: Number of random questions to load for this attempt
                  example: 5
      responses:
        "200":
          description: Quiz loaded and attempt created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Quiz loaded successfully. You may proceed with the attempt.
                  attempt:
                    type: object
                    properties:
                      _id:
                        type: string
                        description: Attempt ID
                        example: "67501c4422baf1b3d1ef59ab"
                      quiz:
                        type: object
                        description: Quiz object with randomized questions (without isCorrect)
                        properties:
                          _id:
                            type: string
                            example: "67373f9d21f91e23b2a5f1ad"
                          title:
                            type: string
                            example: "JavaScript Basics Quiz"
                          questionCounts:
                            type: array
                            items: { type: integer }
                            example: [5, 10, 15]
                          questions:
                            type: array
                            items:
                              type: object
                              properties:
                                _id:
                                  type: string
                                  example: "67373f9d21f91e23b2a5f1bd"
                                text:
                                  type: string
                                  example: "What is a closure in JavaScript?"
                                answers:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      _id:
                                        type: string
                                        example: "67373f9d21f91e23b2a5f200"
                                      text:
                                        type: string
                                        example: "A function with preserved scope"
                                      picture:
                                        type: string
                                        example: "public/uploads/quizzes/1731600110_example.png"
        "400":
          description: Invalid input data (wrong question count)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid question count value.
        "404":
          description: Quiz not found or quiz has no available questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Quiz not found or no questions available.
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error. Please try again later.





# Creator
  /quiz/add:
    post:
      summary: Create a new quiz
      description: >
        Creates a new quiz in the database.  
        Requires authentication and accepts **multipart/form-data** (with an image file).  
        Returns the created quiz information or its ID.
      tags: [Creator]
      security:
        - bearerAuth: []   # JWT auth middleware required
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - description
                - category
              properties:
                title:
                  type: string
                  description: Quiz title
                  example: JavaScript Basics
                description:
                  type: string
                  description: Short summary about the quiz
                  example: A beginner-level quiz to test basic JavaScript knowledge.
                category:
                  type: string
                  description: Category or topic name
                  example: Programming
                image:
                  type: string
                  format: binary
                  description: Upload quiz image (optional)
                isShuffle:
                  type: boolean
                  description: Whether to shuffle question order
                  example: true
                passingPercent:
                  type: number
                  description: Minimum percent required to pass
                  example: 70
                hashtags:
                  type: array
                  description: Hashtags related to the quiz
                  items:
                    type: string
                  example: ["#javascript", "#frontend", "#quiz"]
                questions:
                  type: array
                  description: List of question IDs or question objects
                  items:
                    type: string
                  example: ["653a9f5f9c0f912b2e4ab123", "653a9f6d1c9b2f7c1e5cd456"]
                isPublished:
                  type: boolean
                  description: Whether the quiz is visible to users
                  example: false
                difficulty:
                  type: string
                  description: Difficulty level (e.g., easy, medium, hard)
                  example: medium
                questionCounts:
                  type: number
                  description: Total number of questions in the quiz
                  example: 10
      responses:
        "201":
          description: Quiz created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  quizId:
                    type: string
                    description: full object of created quiz
                    example: IQuiz
        "400":
          description: Missing or invalid required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Please fill in all required fields correctly.
        "500":
          description: Server or validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error.

  /quiz/edit/{id}:
    put:
      summary: Update an existing quiz
      description: >
        Updates an existing quiz by its ID.  
        Accepts **multipart/form-data** to optionally upload a new image.  
        Requires authentication and author permissions.
      tags: [Creator]
      security:
        - bearerAuth: []   # JWT auth middleware required
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the quiz to update
          schema:
            type: string
            example: 6542a3c6e2a2cf9c5d3a7810
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - description
                - category
              properties:
                title:
                  type: string
                  description: Quiz title
                  example: Advanced JavaScript Concepts
                description:
                  type: string
                  description: Detailed description of the quiz content
                  example: An advanced-level quiz to test your deep knowledge of JS.
                category:
                  type: string
                  description: Quiz category or topic
                  example: Programming
                image:
                  type: string
                  format: binary
                  description: Optional new quiz image to replace existing one
                isShuffle:
                  type: boolean
                  description: Shuffle questions randomly
                  example: false
                passingPercent:
                  type: number
                  description: Minimum passing score in percent
                  example: 80
                hashtags:
                  type: array
                  items:
                    type: string
                  description: Hashtags for quiz tagging
                  example: ["#advanced", "#javascript", "#backend"]
                questions:
                  type: array
                  description: List of question IDs or objects
                  items:
                    type: string
                  example: ["653a9f5f9c0f912b2e4ab123", "653a9f6d1c9b2f7c1e5cd456"]
                isPublished:
                  type: boolean
                  description: Whether quiz is published or draft
                  example: true
                difficulty:
                  type: string
                  description: Difficulty level (easy, medium, hard)
                  example: hard
                questionCounts:
                  type: number
                  description: Total number of questions in quiz
                  example: 15
      responses:
        "200":
          description: Quiz updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          description: Invalid input or nothing to update
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Nothing to update
        "401":
          description: Unauthorized (no or invalid JWT)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized
        "500":
          description: Internal server or validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error.

  /quiz/{id}/toggle-publish:
    put:
      summary: Toggle quiz publish status
      description: >
        Toggles the `isPublished` status of a quiz (true ↔ false).  
        Only the author of the quiz can perform this action.  
        Requires authentication with a valid JWT token.
      tags: [Creator]
      security:
        - bearerAuth: []   # JWT authentication required
      parameters:
        - name: id
          in: path
          required: true
          description: Quiz ID to toggle publish status
          schema:
            type: string
            example: 6542a3c6e2a2cf9c5d3a7810
      responses:
        "200":
          description: Quiz publish status toggled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Quiz published successfully.
                  isPublished:
                    type: boolean
                    example: true
        "404":
          description: Quiz not found or doesn't belong to user
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Quiz not found.
        "401":
          description: Unauthorized (missing or invalid JWT token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized.
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error.

  /quiz/all:
    get:
      summary: Get all quizzes created by the authenticated user
      description: >
        Returns all quizzes created by the currently authenticated user.  
        Includes the total count of quizzes in the response.  
        Requires JWT authentication.
      tags: [Creator]
      security:
        - bearerAuth: []   # JWT auth middleware required
      responses:
        "200":
          description: Quizzes retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: All quizzes created by this user.
                  count:
                    type: number
                    description: Total number of quizzes found
                    example: 3
                  quizes:
                    type: array
                    description: Array of quizzes belonging to the authenticated user
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          example: 6542a3c6e2a2cf9c5d3a7810
                        title:
                          type: string
                          example: JavaScript Basics
                        description:
                          type: string
                          example: A quiz for beginners to test JS fundamentals.
                        category:
                          type: string
                          example: Programming
                        image:
                          type: string
                          example: uploads/quizzes/1730418459example.png
                        authorId:
                          type: string
                          example: 652f812ea6f9f2b3c97f8a12
                        isShuffle:
                          type: boolean
                          example: true
                        passingPercent:
                          type: number
                          example: 70
                        hashtags:
                          type: array
                          items:
                            type: string
                          example: ["#javascript", "#frontend"]
                        questions:
                          type: array
                          description: Array of question objects (if populated)
                          items:
                            type: object
                            properties:
                              _id:
                                type: string
                                example: 69035c6e023d0e5e3aab69c3
                              title:
                                type: string
                                example: What is a closure in JavaScript?
                              type:
                                type: string
                                example: single
                              point:
                                type: number
