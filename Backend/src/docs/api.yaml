openapi: 3.0.0
info:
  title: Quiz Platform API
  version: 1.0.0
  description: >
    REST API for a quiz platform with three roles:
    - **Member**: regular user (can view quizzes and update profile)
    - **Creator**: can create and manage quizzes
    - **Admin**: full access to manage users and content

servers:
  - url: http://localhost:4008


tags:
  - name: Auth
    description: Authentication and account management
  - name: Member
    description: User profile and account settings. Can also take quizzes and participate in tests.
  - name: Creator
    description: Quiz creation and management

paths:
  /signup:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a new account with username, and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, repassword]
              properties:
                username:
                  type: string
                password:
                  type: string
                repassword:
                  type: string
      responses:
        "201":
          description: Registration has been successfully completed.
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                missingFields:
                  summary: Missing required fields
                  value: { status: "error", message: "All fields are required." }
                usernameIsBusy:
                  summary: Username is busy
                  value: {status: "error", message: "Username is busy"}
                passwordMismatch:
                  summary: Passwords do not match
                  value: { status: "error", message: "Passwords do not match." }
                weakPassword:
                  summary: Weak password
                  value: { status: "error", message: "Password does not meet the requirements." }

  /login:
    post:
      tags: [Auth]
      summary: Login user
      description: Authenticates a user and returns a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password ,remember]
              properties:
                username:
                  type: string
                password:
                  type: string
                remember:
                  type: boolean
      responses:
        "200":
          description: `{ status: string, message?: string, token: string }`
        "400":
          description: Bad Request
          content:
            application/json:
              examples:
                missingFields:
                  summary: Missing required fields
                  value: { status: "error", message: "All fields are required." }
                usernameOrPassword:
                  summary: Incorrect username or password.
                  value: { status: "error", message: "Incorrect username or password." }

  /profile:
    get:
      tags: [Auth]
      summary: Get user profile information
      description: Returns the authenticated user's profile data.
      security:
        - bearerAuth: []   # JWT auth (Authorization header)
      responses:
        "200":
          description: Successfully retrieved user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                    example: 671b5b8dcf9a2d0012f4fbc9
                  username:
                    type: string
                    example: johndoe
                  email:
                    type: string
                    example: johndoe@example.com
                  name:
                    type: string
                    example: John
                  surname:
                    type: string
                    example: Doe
                  phone:
                    type: string
                    example: "+37495306596"
                  avatar:
                    type: string
                    example: "https://example.com/uploads/avatar.jpg"
                  isVerified:
                    type: boolean
                    example: true
                  role:
                    type: string
                    example: member
        "401":
          description: Unauthorized – Missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Unauthorized – invalid or expired token

  /profile/verify:
    post:
      summary: Send account verification email
      description: Sends a verification link to the user's email address.
      tags: [Auth]
      security:
        - bearerAuth: []   # եթե պահանջում է մուտք գործած user-ի token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: johndoe@example.com
              required:
                - email
      responses:
        "200":
          description: Verification email successfully sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Verification email has been sent to your inbox.
        "400":
          description: Invalid or missing email address
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Please provide a valid email address.
        "409":
          description: User already verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: This account has already been verified.
        "500":
          description: Server error – email could not be sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Failed to send verification email. Please try again later.

  /profile/update:
    put:
      summary: Update user profile information
      description: Allows an authenticated user to update their personal information (name, surname, and phone number).
      tags: [Auth]
      security:
        - bearerAuth: []   # JWT auth required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - surname
                - phone
              properties:
                name:
                  type: string
                  example: John
                surname:
                  type: string
                  example: Doe
                phone:
                  type: string
                  description: Must be a valid phone number
                  example: "+37495306596"
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Profile updated successfully.
                  payload:
                    type: string
                    example: User information updated in the database.
        "400":
          description: Invalid input data
          content:
            application/json:
              examples:
                missingFields:
                  summary: Missing required fields
                  value:
                    status: error
                    message: Fields are required.
                invalidPhone:
                  summary: Invalid phone number
                  value:
                    status: error
                    message: Phone number is not valid.
                noChanges:
                  summary: No changes made
                  value:
                    status: error
                    message: No changes were made.
        "401":
          description: Unauthorized – User is not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Unauthorized – invalid or expired token
        "500":
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Internal server error. Please try again later.

  /profile/avatar:
    post:
      summary: Upload or update profile avatar
      description: >
        Uploads a new avatar image for the authenticated user.
        The file should be sent as `multipart/form-data` with the key `picture`.
      tags: [Auth]
      security:
        - bearerAuth: []   # JWT token required
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                picture:
                  type: File
                  description: Image file to upload as avatar
      responses:
        "200":
          description: Avatar uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Avatar path saved in user profile
                  payload:
                    type: string
                    example: /public/uploads/avatar123.png
        "400":
          description: Invalid file or missing picture field
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: File upload failed or picture not provided
        "401":
          description: Unauthorized – User not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Unauthorized – invalid or expired token
        "500":
          description: Server error – failed to save avatar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Failed to upload or save avatar. Please try again later.


  /quiz/add:
    post:
      summary: Create a new quiz
      description: Creates a new quiz with title, description, category, and an optional image file.
      tags: [Creator]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - description
                - category
              properties:
                title:
                  type: string
                  description: Title of the quiz
                  example: "JavaScript Fundamentals"
                description:
                  type: string
                  description: Short description of the quiz
                  example: "Test your knowledge of JS basics."
                category:
                  type: string
                  description: Category of the quiz
                  example: "Programming"
                image:
                  type: string
                  format: binary
                  description: Optional image file for the quiz (uploaded as multipart form data)
                isShuffle:
                  type: boolean
                  description: Whether to shuffle questions
                  default: false
                  example: false
                passingPercent:
                  type: number
                  description: Minimum percentage to pass
                  default: 60
                  example: 60
                hashtags:
                  type: array
                  items:
                    type: string
                  description: List of hashtags
                  example: ["javascript", "frontend"]
                questions:
                  type: array
                  items:
                    type: string
                  description: List of question IDs or titles
                  example: []
                questionCounts:
                  type: array
                  items:
                    type: number
                  description: Available question count options that the user can choose for this quiz
                  example: [20,50,100]
                isPublished:
                  type: boolean
                  description: Whether the quiz is published
                  default: false
                  example: false
                difficulty:
                  type: string
                  description: Difficulty level
                  enum: [easy, medium, hard]
                  default: easy
                  example: easy
      responses:
        "201":
          description: Quiz created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Quiz created successfully
                  quiz:
                    type: object
        "400":
          description: Invalid input data
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Please fill in all required fields correctly


  /quiz/hashtag/add/{id}:
    put:
      summary: Add a new hashtag to a quiz
      description: Allows a creator to add a hashtag string to the quiz's hashtag list.
      tags: [Creator]
      security:
        - bearerAuth: []  # JWT authentication if required
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the quiz to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hashtag
              properties:
                hashtag:
                  type: string
                  example: "javascript"
      responses:
        "200":
          description: Hashtag added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hashtag added successfully
                  post:
                    type: object
                    description: Updated quiz object with new hashtag
        "404":
          description: Quiz not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Quiz not found
        "500":
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal Server Error






components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT