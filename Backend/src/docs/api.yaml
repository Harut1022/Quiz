  /quiz/question/delete/{id}:
    delete:
      summary: Delete a question from a quiz
      description: Deletes a specific question by its ID and removes it from the associated quiz. Only the quiz author can perform this action.
      tags: [Creator]
      security:
        - bearerAuth: []   # Requires JWT authentication
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The unique ID of the question to be deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quizId
              properties:
                quizId:
                  type: string
                  description: The ID of the quiz that contains the question.
                  example: "674ac82b6f2d9d06e9a5b32e"
      responses:
        "200":
          description: Question deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Question deleted successfully.
              example:
                success: true
                message: "Question deleted successfully."
        "400":
          description: Missing or invalid request fields.
          content:
            application/json:
              examples:
                MissingFields:
                  summary: Required fields are missing.
                  value:
                    message: "Both quizId and questionId are required."
                InvalidRequest:
                  summary: Invalid data format.
                  value:
                    message: "Invalid request payload."
        "404":
          description: Question or quiz not found.
          content:
            application/json:
              examples:
                QuestionNotFound:
                  summary: Question not found in the specified quiz.
                  value:
                    message: "Question not found in the specified quiz."
                QuizNotFound:
                  summary: Quiz not found or user not authorized.
                  value:
                    message: "Quiz not found or you do not have permission to modify it."
        "500":
          description: Internal server error.
          content:
            application/json:
              example:
                message: "An unexpected error occurred while deleting the question."

