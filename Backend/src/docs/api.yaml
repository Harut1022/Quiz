  /quiz/question/add/{id}:
    post:
      summary: Add a new question to a quiz
      description: Creates a new question and attaches it to the specified quiz. The endpoint also supports uploading an optional image and adding predefined answers.
      tags: [Creator]
      security:
        - bearerAuth: []   # Requires JWT authentication
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the quiz to which the question will be added.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  description: Question title or text.
                  example: "What is the capital of France?"
                image:
                  type: string
                  format: binary
                  description: Optional image file for the question.
                answers:
                  type: array
                  description: List of possible answers for this question.
                  items:
                    type: object
                    properties:
                      text:
                        type: string
                        example: "Paris"
                      isCorrect:
                        type: boolean
                        example: true
                type:
                  type: string
                  enum: [single, multiple]
                  example: "single"
                  description: Defines whether the question allows one or multiple correct answers.
                isShuffle:
                  type: boolean
                  example: true
                  description: Indicates whether answers should be displayed in random order.
                point:
                  type: number
                  example: 5
                  description: Number of points awarded for a correct answer.
      responses:
        "200":
          description: Question added successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Question added successfully.
