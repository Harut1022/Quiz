                    type: object
                    properties:
                      _id:
                        type: string
                        example: "674ac82b6f2d9d06e9a5b32e"
                      title:
                        type: string
                        example: "Geography Quiz"
                      isPublished:
                        type: boolean
                        example: true
                      authorId:
                        type: string
                        example: "674ac82b6f2d9d06e9a5b32f"
                      questions:
                        type: array
                        description: List of questions in this quiz.
                        items:
                          type: object
                          properties:
                            _id:
                              type: string
                              example: "674ac8b56f2d9d06e9a5b332"
                            title:
                              type: string
                              example: "What is the capital of France?"
                            image:
                              type: string
                              example: "uploads/questions/674ac8b56.png"
                            type:
                              type: string
                              enum: [single, multiple]
                              example: "single"
                            point:
                              type: number
                              example: 5
                            isShuffle:
                              type: boolean
                              example: true
                            answers:
                              type: array
                              items:
                                type: object
                                properties:
                                  text:
                                    type: string
                                    example: "Paris"
                                  isCorrect:
                                    type: boolean
                                    example: true
              example:
                message: "Question added successfully."
                quiz:
                  _id: "674ac82b6f2d9d06e9a5b32e"
                  title: "Geography Quiz"
                  isPublished: true
                  authorId: "674ac82b6f2d9d06e9a5b32f"
